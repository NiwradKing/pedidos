<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Salidas - Bodega</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <!-- Indicador del Usuario -->
        <div class="user-card" id="user-info" style="display: none;">
            <span>Registrando como: <strong id="user-display"></strong></span>
        </div>

        <!-- Formulario de Registro de Salida -->
        <div class="card">
            <h2>Registrar Salida de Producto</h2>
            <form id="form-salida">
                <div class="form-group">
                    <label for="producto-nombre">Nombre de la Bebida / Producto</label>
                    <input type="text" id="producto-nombre" placeholder="Ej: Cerveza Poker, Gaseosa..." required>
                </div>
                <div class="form-group">
                    <label for="cantidad-salida">Cantidad a retirar</label>
                    <input type="number" id="cantidad-salida" min="1" value="1" required>
                </div>
                <button type="submit">Registrar Salida</button>
            </form>
        </div>

        <!-- Historial de Salidas -->
        <div class="card">
            <h2>Historial de Salidas en Tiempo Real</h2>
            <ul id="lista-historial" class="item-list">
                <!-- Carga dinámica -->
            </ul>
        </div>
    </div>

    <!-- Scripts de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
